services:
  - type: web
    name: theclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: THECLAW_GATEWAY_PORT
        value: "8080"
      - key: THECLAW_STATE_DIR
        value: /data/.theclaw
      - key: THECLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: THECLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: theclaw-data
      mountPath: /data
      sizeGB: 1
