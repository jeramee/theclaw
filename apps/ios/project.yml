name: TheClaw
options:
  bundleIdPrefix: ai.theclaw
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  TheClawKit:
    path: ../shared/TheClawKit
  Swabble:
    path: ../../Swabble

schemes:
  TheClaw:
    shared: true
    build:
      targets:
        TheClaw: all
    test:
      targets:
        - TheClawTests
        - TheClawLogicTests
  TheClawLogicTests:
    shared: true
    build:
      targets:
        TheClawLogicTests: all
    test:
      targets:
        - TheClawLogicTests

targets:
  TheClaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: TheClawShareExtension
        embed: true
      - target: TheClawActivityWidget
        embed: true
      - target: TheClawWatchApp
      - package: TheClawKit
      - package: TheClawKit
        product: TheClawChatUI
      - package: TheClawKit
        product: TheClawProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/TheClawKit,$SRCROOT/../../Swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/TheClaw.entitlements
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(THECLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(THECLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          THECLAW_PUSH_TRANSPORT: direct
          THECLAW_PUSH_DISTRIBUTION: local
          THECLAW_PUSH_RELAY_BASE_URL: ""
          THECLAW_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          THECLAW_PUSH_TRANSPORT: direct
          THECLAW_PUSH_DISTRIBUTION: local
          THECLAW_PUSH_RELAY_BASE_URL: ""
          THECLAW_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TheClaw
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.theclaw.ios
            CFBundleURLSchemes:
              - theclaw
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        TheClawCanonicalVersion: "$(THECLAW_IOS_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.theclaw.ios.bgrefresh
        NSLocalNetworkUsageDescription: TheClaw discovers and connects to your TheClaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _theclaw-gw._tcp
        NSCameraUsageDescription: TheClaw can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: TheClaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: TheClaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: TheClaw needs microphone access for voice wake.
        NSMotionUsageDescription: TheClaw may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: TheClaw needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: TheClaw uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        TheClawPushTransport: "$(THECLAW_PUSH_TRANSPORT)"
        TheClawPushDistribution: "$(THECLAW_PUSH_DISTRIBUTION)"
        TheClawPushRelayBaseURL: "$(THECLAW_PUSH_RELAY_BASE_URL)"
        TheClawPushAPNsEnvironment: "$(THECLAW_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  TheClawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: TheClawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(THECLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(THECLAW_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TheClaw Share
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  TheClawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/TheClawActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(THECLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: TheClaw Activity
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TheClawWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: TheClawWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(THECLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(THECLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(THECLAW_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(THECLAW_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: TheClaw
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(THECLAW_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  TheClawWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(THECLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(THECLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(THECLAW_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(THECLAW_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: TheClaw
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(THECLAW_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  TheClawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: TheClaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.theclaw.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TheClaw.app/TheClaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: TheClawTests
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"

  TheClawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: TheClawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(THECLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(THECLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.theclaw.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: TheClawLogicTests
        CFBundleShortVersionString: "$(THECLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(THECLAW_BUILD_VERSION)"
